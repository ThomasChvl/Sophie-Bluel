<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Connexion - Sophie Bluel</title>
	<meta name="description" content="Connexion à l'espace d'administration du portfolio de Sophie Bluel.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./assets/style.css">
	<script src="./assets/login.js" defer></script>
</head>
<body class="login-page">
	<header>
		<h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
		<nav aria-label="Navigation principale">
			<ul>
				<li><a href="./index.html#portfolio">projets</a></li>
				<li><a href="./index.html#contact">contact</a></li>
				<li><a href="./login.html" aria-current="page">login</a></li>
				<li><img src="./assets/icons/instagram.png" alt="Instagram"></li>
			</ul>
		</nav>
	</header>
	<main>
		<section id="login" aria-labelledby="login-title">
			<h2 id="login-title">Log In</h2>
			<form id="login-form" method="post">
				<label for="email">E-mail</label>
				<input type="email" id="email" name="email" autocomplete="username" required>
				<label for="password">Mot de passe</label>
				<input type="password" id="password" name="password" autocomplete="current-password" required>
				<button type="submit">Se connecter</button>
			</form>
			<a class="forgot-password" role="link" aria-disabled="true">Mot de passe oublié</a>
		</section>
	</main>
	<footer>
		<nav aria-label="Informations légales">
			<ul>
				<li>Mentions Légales</li>
			</ul>
		</nav>
	</footer>
</body>
</html>
